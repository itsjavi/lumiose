[package]
name = "lumen_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lumen_compiler = { workspace = true, features = ["serde"] }
lumen_css.workspace = true
lumen_svg.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

# Lightning CSS seeds ahash through getrandom: in the browser it reads `crypto.getRandomValues`
# (with `--cfg getrandom_backend="wasm_js"`, set in .cargo/config.toml).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
