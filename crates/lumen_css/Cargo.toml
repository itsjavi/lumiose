[package]
name = "lumen_css"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["browserslist"]
# Browserslist query support (`browserslist_targets`). Hosts without a clock or file system
# (wasm) can disable it and pass Lightning CSS `Targets` directly.
browserslist = ["lightningcss/browserslist"]

[dependencies]
lightningcss.workspace = true
parcel_sourcemap.workspace = true
