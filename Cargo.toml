[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Shared dependencies are pinned exactly (decision-5); owners add them here.
[workspace.dependencies]
lumen_compiler = { path = "crates/lumen_compiler" }
# lumen_css: browserslist is opted into by hosts that have a file system and a clock (napi).
lumen_css = { path = "crates/lumen_css", default-features = false }
lumen_svg = { path = "crates/lumen_svg" }
lumen_content = { path = "crates/lumen_content" }

# OXC: every oxc_* crate on the same exact version.
oxc_allocator = "=0.153.0"
oxc_ast = "=0.153.0"
oxc_ast_visit = "=0.153.0"
oxc_codegen = "=0.153.0"
oxc_diagnostics = "=0.153.0"
oxc_parser = "=0.153.0"
oxc_semantic = "=0.153.0"
oxc_sourcemap = "=9.0.0"
oxc_span = "=0.153.0"
oxc_syntax = "=0.153.0"
oxc_transformer = "=0.153.0"

serde = { version = "=1.0.229", features = ["derive"] }

# CSS (lumen_css): parcel_sourcemap is the map type Lightning CSS prints into.
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["sourcemap", "visitor"] }
parcel_sourcemap = { version = "=2.1.1", features = ["json"] }

# SVG imports (lumen_svg): the XML parser, and the CSS tokenizer Lightning CSS already ships
# (same version) for prefixing ids in `<style>`.
cssparser = "=0.37.0"
roxmltree = "=0.21.1"

# Markdown and HTML imports (lumen_content): comrak for CommonMark + GFM (autolinks included),
# html5ever for spec-compliant HTML tree building.
comrak = { version = "=0.55.0", default-features = false }
html5ever = "=0.40.1"

# Bindings
napi = { version = "=3.14.2", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = "=3.6.12"
napi-build = "=2.6.0"
wasm-bindgen = "=0.2.129"
serde-wasm-bindgen = "=0.6.5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
