# Nightly fuzzing (TASK-311, decision-56): every cargo-fuzz target of fuzz/ for a bounded time, and
# the app layer's property tests at a high case count. Scheduled only, never on push; a crash fails
# the run and its input is uploaded as an artifact. CONTRIBUTING.md (Fuzzing) has the local steps.
name: Fuzz

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target
        default: "600"
      runs:
        description: Cases per property test
        default: "200000"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
  PROPERTY_RUNS: ${{ inputs.runs || '200000' }}

jobs:
  targets:
    name: list fuzz targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The [[bin]] names of fuzz/Cargo.toml: every target, without building anything.
      - id: list
        run: |
          targets=$(awk '/^\[\[bin\]\]/ { bin = 1 } bin && /^name = / { gsub(/"/, "", $3); print $3; bin = 0 }' fuzz/Cargo.toml | jq -R . | jq -s -c .)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-fuzz needs nightly for the sanitizers; the repository's toolchain file pins stable.
      - name: Rust nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}

      # The corpus grows from night to night; the fixtures seed it on the first run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - run: fuzz/seed.sh

      - name: Fuzz for ${{ env.SECONDS_PER_TARGET }} s
        run: >
          cargo +nightly fuzz run ${{ matrix.target }} --fuzz-dir fuzz --
          -max_total_time=${{ env.SECONDS_PER_TARGET }} -timeout=30 -rss_limit_mb=4096

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  properties:
    name: property tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the native compiler
        run: pnpm build:compiler

      # A failure prints its seed: LUMIOSE_PROPERTY_SEED=<seed> reproduces it.
      - name: ${{ env.PROPERTY_RUNS }} cases per property
        run: pnpm --filter lumiose test:properties ${{ env.PROPERTY_RUNS }}
