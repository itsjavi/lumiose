# Publishes a release. `pnpm release:version <x.y.z>` commits the new version and tags it; pushing
# the tag (vX.Y.Z) runs this workflow: the Binaries workflow builds and smoke-tests every compiler
# binary, then scripts/publish.ts packs every package (the binaries go into their
# @lumiose/compiler-<platform> packages) and publishes them to npm with provenance, platform packages
# first, and the github-release job creates the tag's GitHub release with its changelog section.
# A package outside lockstep has its own tags (`pnpm release:version <x.y.z> --package @lumiose/ui`
# tags @lumiose/ui@X.Y.Z, decision-54): pushing one publishes that package alone, without the
# Binaries workflow, and creates its GitHub release from its own CHANGELOG.md.
# A v<x.y.z> tag also ships the VS Code extension (decision-89): the vscode job packages one .vsix
# per platform, github-release attaches them, and the vscode-marketplace and vscode-open-vsx jobs
# publish them (their setup: packages/vscode/README.md, Releases).
# Until the repository variable LUMIOSE_PUBLISH is "true", it is a dry run that publishes nothing;
# a manual run (workflow_dispatch) is always a dry run.
# npm trusts this workflow (trusted publishing, set on each package's npm settings), so no token is
# involved: npm exchanges the publish job's OIDC identity for one-off publish credentials.
name: Release

on:
  push:
    tags: ["v*", "@lumiose/*@*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    # A package outside lockstep ships no compiler binary.
    if: ${{ !startsWith(github.ref_name, '@') }}
    uses: ./.github/workflows/binaries.yml
    with:
      release: true

  publish:
    needs: binaries
    if: ${{ !cancelled() && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No registry-url: it would write an .npmrc with a token line, and a token must never stand
      # in for trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check that npm supports trusted publishing (11.5.1 or later)
        run: |
          version="$(npm --version)"
          if [[ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != "11.5.1" ]]; then
            echo "::error::npm $version is too old for trusted publishing (11.5.1 or later)."
            exit 1
          fi
          echo "npm $version"

      - run: pnpm install --frozen-lockfile

      # Every compiler-<target> artifact, flattened into packages/compiler, where scripts/publish.ts
      # picks up each binary for its platform package.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !startsWith(github.ref_name, '@') }}
        with:
          pattern: compiler-*
          path: packages/compiler
          merge-multiple: true

      - name: Publish
        run: node scripts/publish.ts ${{ (github.event_name == 'push' && vars.LUMIOSE_PUBLISH == 'true') && ' ' || '--dry-run' }}

  # The VS Code extension's .vsix for every platform, packaged on one runner: its build only copies
  # each target's compiler binary from the Binaries workflow's artifacts. Dry runs package it too.
  vscode:
    needs: binaries
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compiler-*
          path: packages/compiler
          merge-multiple: true

      - name: Package
        working-directory: packages/vscode
        run: node scripts/package.ts --all

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-vsix
          path: packages/vscode/*.vsix
          if-no-files-found: error

  # Publishes the .vsix files to the VS Code Marketplace (publisher lumiose) after npm, on a real
  # release of an x.y.z version: the Marketplace takes no x.y.z-* versions, which only go to the
  # GitHub release. It signs in with Microsoft Entra ID (workload identity federation, no secret):
  # the federated credential trusts this job's environment, since its subject cannot match every tag.
  # Without the VSCE_AZURE_* variables it warns and publishes nothing: then upload the GitHub
  # release's .vsix files on the publisher's page by hand.
  vscode-marketplace:
    needs: [vscode, publish]
    if: ${{ !cancelled() && needs.vscode.result == 'success' && needs.publish.result == 'success' && github.event_name == 'push' && vars.LUMIOSE_PUBLISH == 'true' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      # Microsoft Entra ID workload identity federation.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter lumiose-vscode

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-vsix
          path: packages/vscode/release

      - name: Check the Marketplace sign-in
        if: ${{ vars.VSCE_AZURE_CLIENT_ID == '' || vars.VSCE_AZURE_TENANT_ID == '' }}
        run: echo "::warning::VSCE_AZURE_CLIENT_ID or VSCE_AZURE_TENANT_ID is not set, so nothing was published to the VS Code Marketplace. Upload the GitHub release's .vsix files on the publisher's page."

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: ${{ vars.VSCE_AZURE_CLIENT_ID != '' && vars.VSCE_AZURE_TENANT_ID != '' }}
        with:
          client-id: ${{ vars.VSCE_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.VSCE_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the VS Code Marketplace
        if: ${{ vars.VSCE_AZURE_CLIENT_ID != '' && vars.VSCE_AZURE_TENANT_ID != '' }}
        working-directory: packages/vscode
        run: pnpm exec vsce publish --azure-credential --skip-duplicate --packagePath release/*.vsix

  # Publishes the .vsix files to Open VSX (namespace lumiose), for Cursor, VSCodium and other forks,
  # like vscode-marketplace. Open VSX trusts this workflow (trusted publishing) once the extension has
  # a version there; the first version needs the OVSX_PAT secret, which must be deleted afterwards,
  # since a token takes precedence over trusted publishing.
  vscode-open-vsx:
    needs: [vscode, publish]
    if: ${{ !cancelled() && needs.vscode.result == 'success' && needs.publish.result == 'success' && github.event_name == 'push' && vars.LUMIOSE_PUBLISH == 'true' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Open VSX trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter lumiose-vscode

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-vsix
          path: packages/vscode/release

      - name: Publish to Open VSX
        working-directory: packages/vscode
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -n "$OVSX_TOKEN" ]]; then
            OVSX_PAT="$OVSX_TOKEN" pnpm exec ovsx publish --skip-duplicate --packagePath release/*.vsix
          else
            pnpm exec ovsx publish --trusted-publishing --skip-duplicate --packagePath release/*.vsix
          fi

  # The GitHub release of the tag, after a real publish only (a dry run creates none): titled by the
  # tag, with the version's CHANGELOG.md section as notes (the package's own for a package outside
  # lockstep, never marked Latest), a pre-release for x.y.z-* versions, and the VS Code extension's
  # .vsix files of a v<x.y.z> tag. A re-run updates the notes and files of the release it created.
  github-release:
    needs: [publish, vscode]
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.event_name == 'push' && vars.LUMIOSE_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG##*@}"
          version="${version#v}"
          notes="$RUNNER_TEMP/notes.md"
          node scripts/release-notes.ts "$TAG" > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
          else
            flags=(--title "$TAG" --notes-file "$notes" --verify-tag)
            if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
            # The repository's Latest release stays the newest Lumiose version.
            if [[ "$TAG" != v* ]]; then flags+=(--latest=false); fi
            gh release create "$TAG" "${flags[@]}"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.vscode.result == 'success' }}
        with:
          name: vscode-vsix
          path: vsix

      - name: Attach the VS Code extension
        if: ${{ needs.vscode.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" vsix/*.vsix --clobber
