# Builds @lumiose/compiler's native binary (crates/lumiose_napi) for every supported platform and the
# WebAssembly compiler (crates/lumiose_wasm), as workflow artifacts. Each binary is loaded and run by
# .github/scripts/smoke-napi.mjs on a matching runner (or under emulation). The napi artifacts fill
# the @lumiose/compiler-<platform> packages (packages/compiler/npm); release.yml calls this workflow.
name: Binaries

# Only when something that goes into the binaries changes: the Rust crates and toolchain, the
# compiler package (napi loader and platform packages) and this workflow's own scripts. CI and Pages
# build the compiler they need themselves; releases always build every binary (release.yml calls
# this workflow with `release: true`), and it can be run by hand. Release-only targets (the
# napi-release job) are built only when `release` is true, to keep the push runs short.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/compiler/**"
      - ".github/workflows/binaries.yml"
      - ".github/scripts/smoke-napi.mjs"
      - ".github/scripts/smoke-wasm.mjs"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/compiler/**"
      - ".github/workflows/binaries.yml"
      - ".github/scripts/smoke-napi.mjs"
      - ".github/scripts/smoke-wasm.mjs"
  workflow_dispatch:
    inputs:
      release:
        description: Also build the release-only targets
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  # Pushes to main all run to the end (several agents push); a newer push to a PR cancels.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  napi:
    name: napi (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: native
          # Cross-compiled on Apple silicon; the smoke test runs an x64 Node under Rosetta.
          - target: x86_64-apple-darwin
            os: macos-latest
            smoke: x64-node
          # The oldest glibc runner, so the binary loads on older distributions too.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            smoke: native
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            smoke: native
          # Linked against musl with cargo-zigbuild; the smoke test runs in an Alpine container.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            smoke: alpine
            zig: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke: native
    runs-on: ${{ matrix.os }}
    # Shared with napi-release (a YAML alias), which builds the release-only targets.
    steps: &napi-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - if: matrix.zig
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-zigbuild

      - if: matrix.zig
        name: Zig (for cargo-zigbuild)
        run: pip3 install ziglang

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @lumiose/compiler

      - name: Build
        shell: bash
        working-directory: packages/compiler
        run: >
          pnpm exec napi build --platform --release --esm --no-const-enum
          --manifest-path ../../crates/lumiose_napi/Cargo.toml --output-dir .
          --target ${{ matrix.target }} ${{ matrix.zig && '-x' || '' }}

      - name: Smoke test
        if: matrix.smoke == 'native'
        run: node .github/scripts/smoke-napi.mjs

      - name: x64 Node
        if: matrix.smoke == 'x64-node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          architecture: x64

      - name: Smoke test (x64 under Rosetta)
        if: matrix.smoke == 'x64-node'
        run: node .github/scripts/smoke-napi.mjs

      - name: Smoke test (Alpine)
        if: matrix.smoke == 'alpine'
        # Docker Hub's official image through the AWS ECR Public mirror. Shared runners still hit
        # its rate limit at times (exit 125), so the pull retries with a backoff before the run.
        run: |
          image=public.ecr.aws/docker/library/node:24-alpine
          for attempt in 1 2 3 4; do
            docker pull "$image" && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 20))
          done
          docker run --rm -v "$PWD:/w" -w /w "$image" node .github/scripts/smoke-napi.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-${{ matrix.target }}
          path: packages/compiler/compiler.*.node
          if-no-files-found: error

  # Targets built only for releases (and manual runs with `release`), not on every push that changes
  # the crates, with the napi job's steps.
  napi-release:
    name: napi (${{ matrix.target }})
    if: inputs.release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alpine on arm64 (Graviton, Ampere, Docker on Apple silicon). Linked against musl with
          # cargo-zigbuild on an arm64 runner, so the node:24-alpine smoke test runs natively.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
            smoke: alpine
            zig: true
    runs-on: ${{ matrix.os }}
    steps: *napi-steps

  # The WASI build of the addon (@lumiose/compiler-wasm32-wasi), the loader's fallback where no
  # native binary fits.
  napi-wasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1-threads

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32-wasip1-threads

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @lumiose/compiler

      # Only the WASI files: the generated index.js and index.d.ts stay the committed ones.
      - name: Build
        working-directory: packages/compiler
        run: >
          pnpm exec napi build --platform --release --esm --no-const-enum
          --manifest-path ../../crates/lumiose_napi/Cargo.toml --output-dir .
          --target wasm32-wasip1-threads && git checkout -- index.js index.d.ts

      - name: Smoke test
        run: node .github/scripts/smoke-napi.mjs --wasi
        env:
          NAPI_RS_FORCE_WASI: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-wasm32-wasip1-threads
          path: |
            packages/compiler/compiler.wasm32-wasi.wasm
            packages/compiler/compiler.wasi.cjs
            packages/compiler/compiler.wasi.d.cts
            packages/compiler/compiler.wasi-browser.js
            packages/compiler/wasi-worker.mjs
            packages/compiler/wasi-worker-browser.mjs
          if-no-files-found: error

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Must match the workspace's wasm-bindgen pin in Cargo.toml.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: wasm-bindgen@0.2.129

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build
        run: |
          cargo build -p lumiose_wasm --release --target wasm32-unknown-unknown
          wasm=target/wasm32-unknown-unknown/release/lumiose_wasm.wasm
          # `web` is what the playground loads; `nodejs` is for Node and the smoke test.
          wasm-bindgen --target web --no-typescript --out-dir dist/wasm-web "$wasm"
          wasm-bindgen --target nodejs --out-dir dist/wasm-node "$wasm"
          # The nodejs output is CommonJS; the repository's package.json says "type": "module".
          echo '{ "type": "commonjs" }' > dist/wasm-node/package.json

      - name: Smoke test
        run: node .github/scripts/smoke-wasm.mjs dist/wasm-node

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumiose-wasm
          path: |
            dist/wasm-web
            dist/wasm-node
          if-no-files-found: error
