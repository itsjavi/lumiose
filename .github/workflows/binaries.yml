# Builds @lumen/compiler's native binary (crates/lumen_napi) for every supported platform and the
# WebAssembly compiler (crates/lumen_wasm), as workflow artifacts. Each binary is loaded and run by
# .github/scripts/smoke-napi.mjs on a matching runner (or under emulation). Publishing to npm waits
# for the package names (TASK-39).
name: Binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  # Pushes to main all run to the end (several agents push); a newer push to a PR cancels.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  napi:
    name: napi (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: native
          # Cross-compiled on Apple silicon; the smoke test runs an x64 Node under Rosetta.
          - target: x86_64-apple-darwin
            os: macos-latest
            smoke: x64-node
          # The oldest glibc runner, so the binary loads on older distributions too.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            smoke: native
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            smoke: native
          # Linked against musl with cargo-zigbuild; the smoke test runs in an Alpine container.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            smoke: alpine
            zig: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - if: matrix.zig
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-zigbuild

      - if: matrix.zig
        name: Zig (for cargo-zigbuild)
        run: pip3 install ziglang

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @lumen/compiler

      - name: Build
        shell: bash
        working-directory: packages/compiler
        run: >
          pnpm exec napi build --platform --release --esm --no-const-enum
          --manifest-path ../../crates/lumen_napi/Cargo.toml --output-dir .
          --target ${{ matrix.target }} ${{ matrix.zig && '-x' || '' }}

      - name: Smoke test
        if: matrix.smoke == 'native'
        run: node .github/scripts/smoke-napi.mjs

      - name: x64 Node
        if: matrix.smoke == 'x64-node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          architecture: x64

      - name: Smoke test (x64 under Rosetta)
        if: matrix.smoke == 'x64-node'
        run: node .github/scripts/smoke-napi.mjs

      - name: Smoke test (Alpine)
        if: matrix.smoke == 'alpine'
        run: docker run --rm -v "$PWD:/w" -w /w node:24-alpine node .github/scripts/smoke-napi.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-${{ matrix.target }}
          path: packages/compiler/compiler.*.node
          if-no-files-found: error

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Must match the workspace's wasm-bindgen pin in Cargo.toml.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: wasm-bindgen@0.2.129

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build
        run: |
          cargo build -p lumen_wasm --release --target wasm32-unknown-unknown
          wasm=target/wasm32-unknown-unknown/release/lumen_wasm.wasm
          # `web` is what the playground loads; `nodejs` is for Node and the smoke test.
          wasm-bindgen --target web --no-typescript --out-dir dist/wasm-web "$wasm"
          wasm-bindgen --target nodejs --out-dir dist/wasm-node "$wasm"
          # The nodejs output is CommonJS; the repository's package.json says "type": "module".
          echo '{ "type": "commonjs" }' > dist/wasm-node/package.json

      - name: Smoke test
        run: node .github/scripts/smoke-wasm.mjs dist/wasm-node

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-wasm
          path: |
            dist/wasm-web
            dist/wasm-node
          if-no-files-found: error
